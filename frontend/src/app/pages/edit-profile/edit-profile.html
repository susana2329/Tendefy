<main>
    <div class="fotoButton">
        @if(avatarUrl){
                    <div class="imagen" >
            <img [src]="avatarUrl"alt="Patofachero">
        </div>
        }
        @else{
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWnEMsLhstI_aVTM9yRDRSUvkhUHKaGubW8EJ8EaXLMA&s=10" alt="">
        }

        <div class="buttonCambiarFoto">
            <form action="perfil/edit/patch" method="patch" enctype="multipart/form-data">
                <input type="file" id="inputProfile" name="fotoPerfil" (input)="selecFotoProfile()">
            </form>
            <button type="file" (click)="abrirInputProfile()">
                <img src="https://design.penpot.app/assets/by-file-media-id/86bdcaa1-299a-806a-8008-20b567da9ce4"
                    alt="camarita">
                Cambiar fotos
            </button>
        </div>
    </div>

    <div class="description">
        <div class="textDescription">
            <h4>Descripcion</h4>
            <p>
                Contanos sobre vos y tus gustos musicales
            </p>
        </div>
        <div class="descriptionCampo">
            <form action="perfil/edit/patch" method="patch" enctype="multipart/form-data">

                <div class="campoText">
                    <textarea id="miTexto" style="white-space: pre-wrap;" maxlength="100" placeholder="Pon tus gustos"
                        (input)=elementoDescripcion() name="descripcion"></textarea>
                </div>
            </form>

            <div class="contador">
                <p>{{contador}}/100</p>
            </div>
        </div>
    </div>



    <div class="contenedorRedesSociales">
        <div class="tituloRedes">
            <img src="enlace.png" alt="enlace">
            <h4>
                Redes sociales
            </h4>
        </div>
        <div class="redesSociales">
            <div class="iconRedes">
                <span class="material-icons">photo_camera</span>
                <img src="tw.png" alt="iconTw">
            </div>
            <div class="nombreRedes">
                <p>Instagram</p>
                <p>Twitter</p>
            </div>
            <div class="inputRedes">
                <form class="formRedes" action="perfil/edit/patch" method="patch" enctype="multipart/form-data">

                    <input [(ngModel)]="instagram" name="instagram">
                    <input [(ngModel)]="twitter" name="twitter">
                </form>
            </div>
        </div>
    </div>

    <div class="contCard">
        <h4>Seleccione sus fotos (maximo 5 fotos) </h4>
        <div class="contInputButton" display="none">
            <form action="perfil/edit/patch" method="patch" enctype="multipart/form-data">
                <input type="file" id="inputFileimg" name="cardsFotos" (input)="imagen()" multiple>
            </form>
            <button (click)="buttoninputfile()">
                Seleccione sus fotos
            </button>
        </div>
        <div class="contImageCard">
            @for(foto of fotos; track foto ) {

            <div class="imgTextCard">
                <div class="imgCard">
                    <img src="{{foto.name}}" class="img" alt="foto">
                </div>
                <p>{{foto.name}}</p>
                <div class="buttonBorrarImg">
                    <button (click)="borrarImagen(foto)">
                        Eliminar
                    </button>
                </div>
            </div>
            }
        </div>
        <div>
        </div>
    </div>


    <div class="buttons">
        <button id="buttonSave" (click)="actualizarDatos()">
            Guardar cambios
        </button>

        <button id="buttonClose">
            Cerrar sesion
        </button>
    </div>
</main>
