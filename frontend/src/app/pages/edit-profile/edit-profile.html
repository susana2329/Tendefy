<main>
    <div class="fotoButton">
        <div class="imagen">
            <img id="imagenPerfil" src="tyler.jpg" alt="Patofachero">
        </div>
        <div class="buttonCambiarFoto">
            <form action="spotify/profile/edit/:id" enctype="multipart/form-data" method="patch">
                <input type="file" id="inputProfile" name="fotoPerfil" (input)="selecFotoProfile()">
            </form>
            <button type="file" (click)="abrirInputProfile()">
                <img src="https://design.penpot.app/assets/by-file-media-id/86bdcaa1-299a-806a-8008-20b567da9ce4"
                    alt="camarita">
                Cambiar fotos
            </button>
        </div>
    </div>

    <div class="description">
        <div class="textDescription">
            <h4>Descripcion</h4>
            <p>
                Contanos sobre vos y tus gustos musicales
            </p>
        </div>
        <div class="descriptionCampo">
            <div class="campoText">
                <textarea id="miTexto" style="white-space: pre-wrap;" maxlength="100" placeholder="Pon tus gustos"
                    (input)=elementoDescripcion()></textarea>
            </div>
            <div class="contador">
                <p>{{contador}}/100</p>
            </div>
        </div>
    </div>



    <div class="contenedorRedesSociales">
        <div class="tituloRedes">
            <h4>
                Informacion
            </h4>
        </div>
        <div class="redesSociales">
            <div class="iconRedes">
                                <img src="assets/icons/profile_picture_user_icon_153847.svg" alt="">
                <img src="assets/icons/weekly-calendar-outline-event-interface-symbol_icon-icons.com_73108.png" alt="">
                <img src="instagram.png" alt="iconInstagram">
                <img src="tw.png" alt="iconTw">
            </div>
            <div class="nombreRedes">
                <p>nombre</p>
                <p>edad</p>
                <p>Instagram</p>
                <p>Twitter</p>
            </div>
            <div class="inputRedes">
                <form action="" class="formRedes" enctype="multipart/form-data" method="patch">
                    <input type="text" placeholder="@Luciano" name="name">
                    <input type="number" placeholder="@23" name="edad">
                    <input type="text" placeholder="@ejemplo" name="instagram">
                    <input type="text" placeholder="@ejemplo" name="twitter">
                </form>
            </div>
        </div>
    </div>

    <div class="contCard">
        <h4>Seleccione sus fotos (maximo 5 fotos) </h4>
        <div class="contInputButton" display="none">
            <form action="" enctype="multipart/form-data" method="patch">
                <input type="file" id="inputFileimg" name="fotoCards" (input)="imagen()" multiple>
            </form>
            <button (click)="buttoninputfile()">
                Seleccione sus fotos
            </button>
        </div>
        <div class="contImageCard">
            @for(foto of fotos; track foto ) {

            <div class="imgTextCard">
                <div class="imgCard">
                    <img src="{{foto.name}}" class="img" id="imgcard" alt="foto">
                </div>
                <p>{{foto.name}}</p>
                <div class="buttonBorrarImg">
                    <button (click)="borrarImagen(foto)">
                        Eliminar
                    </button>
                </div>
            </div>
            }
        </div>
        <div>
        </div>
    </div>


    <div class="buttons">
        <button id="buttonSave" (click)="mandarInfo()">
            Guardar cambios
        </button>

        <button id="buttonClose">
            Cerrar sesion
        </button>
    </div>
</main>
