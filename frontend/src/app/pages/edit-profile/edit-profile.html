<main>
    <div class="fotoButton">

        <div class="imagen">
            <img [src]="avatarUrl" alt="quiero queqeu">
        </div>

        <div class="buttonCambiarFoto">
            <form action="perfil/edit/patch" method="patch" enctype="multipart/form-data">
                <input type="file" id="inputProfile" name="fotoPerfil" (change)="selecFotoProfile()">
            </form>
            <button type="file" (click)="abrirInputProfile()">
                <img src="https://design.penpot.app/assets/by-file-media-id/86bdcaa1-299a-806a-8008-20b567da9ce4"
                    alt="camarita">
                Cambiar fotos
            </button>
        </div>
    </div>

    <div class="description">
        <div class="textDescription">
            <h4>Descripcion</h4>
            <p>
                Contanos sobre vos y tus gustos musicales
            </p>
        </div>
        <div class="descriptionCampo">
            <form action="perfil/edit/patch" method="patch" enctype="multipart/form-data">

                <div class="campoText">
                    <textarea id="miTexto" style="white-space: pre-wrap;" maxlength="200" placeholder="Pon tus gustos"
                        (input)=elementoDescripcion() name="descripcion"></textarea>
                </div>
            </form>

            <div class="contador">
                <p>{{contador}}/200</p>
            </div>
        </div>
    </div>



    <div class="contenedorRedesSociales">
        <div class="tituloRedes">
            <span class="material-icons">emoji_people</span>
            <h4>
                Informacion personal
            </h4>
        </div>
        <div class="redesSociales">
            <div class="iconRedes">
                <span class="material-icons">person</span>
                <span class="material-icons">calendar_month </span>
                <span class="material-icons"> photo_camera</span>
                <span class="material-icons">close</span>
            </div>
            <div class="nombreRedes">
                <p>nombre</p>
                <p>edad</p>
                <p>Instagram</p>
                <p>Twitter</p>
            </div>
            <div class="inputRedes">
                <form class="formRedes" action="perfil/edit/patch" method="patch" enctype="multipart/form-data">
                    <input [(ngModel)]="name" name="nombre">
                    <input [(ngModel)]="edad" name="edad" type="number">
                    <input [(ngModel)]="instagram" name="instagram">
                    <input [(ngModel)]="twitter" name="twitter">
                </form>
            </div>
        </div>
    </div>

    <div class="contCard">
        <h4>Seleccione sus fotos (maximo 5 fotos) </h4>
        <div class="contInputButton" display="none">
            <form action="perfil/edit/patch" method="patch" enctype="multipart/form-data">
                <input type="file" id="inputFileimg" name="cardsFotos" (change)="imagen()" accept="image/*" multiple>
            </form>
            <button (click)="buttoninputfile()">
                Seleccione sus fotos
            </button>
        </div>
        <div class="contImageCard">
            @for(foto of previews; track foto ) {

            <div class="imgTextCard">
                <div class="imgCard">
                    <img src="{{foto}}" class="img" alt="foto">
                </div>
                <div class="buttonBorrarImg">
                    <button (click)="borrarImagen(foto)">
                        Eliminar
                    </button>
                </div>
            </div>
            }
        </div>
        <div>
        </div>
    </div>


    <div class="buttons">
        <button id="buttonSave" (click)="actualizarDatos()">
            Guardar cambios
        </button>

        <button id="buttonClose" (click)="cerrarSesion()">
            Cerrar sesion
        </button>
    </div>
</main>
